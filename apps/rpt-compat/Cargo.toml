[package]
name = "rpt-compat"
description = "A local report compatibility harness: browse a folder of .rpt files, read each report's SQL, data sources and parameters, and render it to PDF in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
rust-version.workspace = true

[[bin]]
name = "rpt-compat"
path = "src/main.rs"

[dependencies]
rpt-reader = { workspace = true }
rpt-render = { workspace = true }
rpt-inputs = { workspace = true }
rpt-pages = { workspace = true }
rpt-query = { workspace = true }
tiny_http = { workspace = true }

[lints]
workspace = true
